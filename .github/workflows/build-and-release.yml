name: Build and Release Cazador YTM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Tests
      run: dotnet test CazadorYTM.slnx --configuration Release

    - name: Publish Self-Contained Win-x64
      run: |
        dotnet publish src/CazadorYTM.Gui/CazadorYTM.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true -o publish/
        
    - name: Copy Auxiliary Assets
      run: |
        Copy-Item -Path "lang" -Destination "publish/" -Recurse -Force
        Copy-Item -Path "README.html", "CHANGELOG.html", "ytdlp_help.txt" -Destination "publish/" -Force

    - name: Download Latest Dependencies (yt-dlp, Deno, FFmpeg)
      run: |
        Write-Host "Downloading latest yt-dlp.exe..."
        Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "publish/yt-dlp.exe"
        
        Write-Host "Downloading latest Deno..."
        Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
        Expand-Archive -Path "deno.zip" -DestinationPath "publish/" -Force
        Remove-Item "deno.zip" -Force
        
        Write-Host "Downloading latest FFmpeg binaries..."
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
        $binFolder = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Directory -Filter "bin" | Select-Object -First 1
        if ($binFolder) {
            Copy-Item -Path "$($binFolder.FullName)\ffmpeg.exe", "$($binFolder.FullName)\ffprobe.exe", "$($binFolder.FullName)\ffplay.exe" -Destination "publish/" -Force
        }
        Remove-Item "ffmpeg.zip" -Force
        Remove-Item "ffmpeg_temp" -Recurse -Force

    - name: Create Release Archive
      run: |
        Compress-Archive -Path "publish/*" -DestinationPath "CazadorYTM-win-x64.zip" -CompressionLevel Optimal

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: CazadorYTM-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
